<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang chủ - Jewelry Shop</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://code.iconify.design/2/2.0.3/iconify.min.js"></script>
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="#"><span class="iconify" data-icon="material-symbols-light:diamond-outline-rounded" alt = "JewelryShop Icon"></span></a>
            </div>
            <ul class="menu">
                <li><a href="#">Trang chủ</a></li>
                <li><a href="#">Trang sức</a></li>
                <li><a href="#">Bộ sưu tập</a></li>
                <li><a href="#">Bài viết</a></li>
                <li><a href="#">Danh sách cửa hàng</a></li>
                <li><a href="#">Liên hệ</a></li>
            </ul>
            <div class="icons">
                <a href="#"><span class="iconify" data-icon="fluent:cart-20-regular"></span></a>
                <a href="#"><span class="iconify" data-icon="ph:magnifying-glass"></span></a>
                <a href="#"><span class="iconify" data-icon="codicon:account"></span></a>
            </div>
        </nav>
    </header>
    <main>
        <!-- Nội dung chính của trang -->
        <section class="banner">
            <img src="images/banner.jpg" alt="Lucky Silver">
            <div class="banner-text">
                
            </div>
        </section>
    </main>

</html>
