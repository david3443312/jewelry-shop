<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang chủ - Jewelry Shop</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Upright:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://code.iconify.design/2/2.0.3/iconify.min.js"></script>
</head>
<body>
    <header>
        <nav>
            <img src="images/logoicon.png" alt="Brand logo" class="logo" style = "width: 50px; height: 50px;">
            <ul class="menu">
                <li><a href="#">Trang chủ</a></li>
                <li><a href="#">Trang sức</a></li>
                <li><a href="#">Bộ sưu tập</a></li>
                <li><a href="#">Bài viết</a></li>
                <li><a href="#">Danh sách cửa hàng</a></li>
                <li><a href="#">Liên hệ</a></li>
            </ul>
            <div class="icons">
                <a href="#"><span class="iconify" data-icon="fluent:cart-20-regular" style="height: 150%; width: 150%;"></span></a>
                <div class="search">
                    <input type="text" placeholder="Tìm kiếm...">
                    <button><span class="iconify" data-icon="ph:magnifying-glass"></span></button>
                </div>
                <a href="#"><span class="iconify" data-icon="codicon:account" style="height: 95%; width: 95%;"></span></a>
            </div>
        </nav>
    </header>
    <main>
        <div class = "banner">
            <div class = "slides">
                <img src="images/homepage1.jpg" alt="banner">
                <img src="images/homepage2.jpg" alt="banner">
                <img src="images/homepage3.jpg" alt="banner">
            </div>
            <a class = "prev" onclick="plusSlides(-1)">&#10094;</a>
            <a class = "next" onclick="plusSlides(1)">&#10095;</a>
        </div>
    </main>
    <script src = "js/slider.js"></script>
</body>
</html>
